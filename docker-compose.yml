# Orquestación de Mercado Local: base de datos MySQL, backend Django y frontend React.
# Las contraseñas y claves se leen del archivo .env (ver .env.example).

services:
  db:
    image: mysql:8.4
    container_name: mercado_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      # Volumen con nombre: los datos sobreviven a "docker compose down"
      - mysql_data:/var/lib/mysql
    networks:
      - mercado_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: ./backend
    container_name: mercado_backend
    restart: unless-stopped
    environment:
      DB_ENGINE: mysql
      DB_HOST: db
      DB_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        # Espera a que MySQL responda antes de arrancar Django
        condition: service_healthy
    networks:
      - mercado_net

  frontend:
    build: ./frontend
    container_name: mercado_frontend
    restart: unless-stopped
    environment:
      # URL que usa el navegador para llegar al backend publicado en el anfitrión
      VITE_BASE_API_URL: ${VITE_BASE_API_URL:-http://localhost:8000}
      VITE_LOCAL_STORAGE_ITEM_NAME: ${VITE_LOCAL_STORAGE_ITEM_NAME:-MERCADO_LOCAL_ACCESS_TOKEN}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - mercado_net

volumes:
  mysql_data:

networks:
  mercado_net:
    driver: bridge
